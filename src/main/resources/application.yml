spring:
  application:
    name: bank-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank_api}
    username: ${DB_USERNAME:bank_user}
    password: ${DB_PASSWORD:bank_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 3000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 15000


  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
      poll-delay-ms: 5000


admin:
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:System}
    last-name: ${ADMIN_LAST_NAME:Administrator}
    birth-date: ${ADMIN_BIRTH_DATE:1970-01-01}
    phone: ${ADMIN_PHONE:}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

server:
  port: 8080