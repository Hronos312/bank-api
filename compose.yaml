services:
  db:
    image: postgres:17-alpine
    container_name: bank-api-db

    environment:
      POSTGRES_DB: bank_api
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password

    ports:
      - "5432:5432"

    volumes:
      - bank_api_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_api"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bank-api-app

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://db:5432/bank_api
      DB_USERNAME: bank_user
      DB_PASSWORD: bank_password

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-System}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Administrator}
      ADMIN_BIRTH_DATE: ${ADMIN_BIRTH_DATE:-1970-01-01}

    ports:
      - "8080:8080"

    restart: unless-stopped

volumes:
  bank_api_postgres_data: