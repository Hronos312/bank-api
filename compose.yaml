services:
  db:
    image: postgres:17-alpine
    container_name: bank-api-db

    environment:
      POSTGRES_DB: bank_api
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password

    ports:
      - "5432:5432"

    volumes:
      - bank_api_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_api"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bank-api-app

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://db:5432/bank_api
      DB_USERNAME: bank_user
      DB_PASSWORD: bank_password

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-System}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Administrator}
      ADMIN_BIRTH_DATE: ${ADMIN_BIRTH_DATE:-1970-01-01}

    ports:
      - "8080:8080"

    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.2
    container_name: bank-api-kafka
    hostname: kafka

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - bank_api_kafka_data:/var/lib/kafka/data

    restart: unless-stopped


volumes:
  bank_api_postgres_data:
  bank_api_kafka_data: