x-readiness: &readiness
  interval: 5s
  timeout: 4s
  retries: 16
  start_period: 15s

services:
  gateway:
    build:
      context: .
      args:
        MODULE: gateway-service
    environment:
      IDENTITY_URL: http://identity:8081
      BANKING_URL: http://banking:8082
      JWT_PUBLIC_KEY: file:/run/secrets/jwt_public
    secrets: [jwt_public]
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    networks: [edge, backend]
    depends_on:
      identity:
        condition: service_healthy
      banking:
        condition: service_healthy
    healthcheck:
      <<: *readiness
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
    restart: unless-stopped

  identity:
    build:
      context: .
      args:
        MODULE: identity-service
    environment:
      DB_URL: jdbc:postgresql://identity-db:5432/identity_db
      DB_USERNAME: identity_user
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?создайте secrets/compose.env}
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:?создайте secrets/compose.env}
      JWT_PUBLIC_KEY: file:/run/secrets/jwt_public
      JWT_PRIVATE_KEY: file:/run/secrets/jwt_private
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-System}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Administrator}
      ADMIN_BIRTH_DATE: ${ADMIN_BIRTH_DATE:-1970-01-01}
    secrets: [jwt_public, jwt_private]
    networks: [backend, identity-data]
    depends_on:
      identity-db:
        condition: service_healthy
    healthcheck:
      <<: *readiness
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8081; printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
    restart: unless-stopped

  banking:
    build:
      context: .
      args:
        MODULE: banking-service
    environment:
      DB_URL: jdbc:postgresql://banking-db:5432/banking_db
      DB_USERNAME: banking_user
      DB_PASSWORD: ${BANKING_DB_PASSWORD:?создайте secrets/compose.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-true}
      IDENTITY_URL: http://identity:8081
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:?создайте secrets/compose.env}
      JWT_PUBLIC_KEY: file:/run/secrets/jwt_public
    secrets: [jwt_public]
    networks: [backend, banking-data, events]
    depends_on:
      banking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *readiness
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8082; printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
    restart: unless-stopped

  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?создайте secrets/compose.env}
    networks: [identity-data]
    volumes:
      - bank_api_identity_data:/var/lib/postgresql/data
    healthcheck:
      <<: *readiness
      test: ["CMD", "pg_isready", "-U", "identity_user", "-d", "identity_db"]
    restart: unless-stopped

  banking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: ${BANKING_DB_PASSWORD:?создайте secrets/compose.env}
    networks: [banking-data]
    volumes:
      - bank_api_banking_data:/var/lib/postgresql/data
    healthcheck:
      <<: *readiness
      test: ["CMD", "pg_isready", "-U", "banking_user", "-d", "banking_db"]
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092},PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    networks: [edge, events]
    volumes:
      - bank_api_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notifications_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?создайте secrets/compose.env}
    networks: [notification-data]
    volumes:
      - bank_api_notification_v2_data:/var/lib/postgresql/data
    healthcheck:
      <<: *readiness
      test: ["CMD", "pg_isready", "-U", "notification_user", "-d", "notifications_db"]
    restart: unless-stopped

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    environment:
      DB_URL: jdbc:postgresql://notification-db:5432/notifications_db
      DB_USERNAME: notification_user
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?создайте secrets/compose.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    networks: [notification-data, events]
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *readiness
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8083; printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
    restart: unless-stopped

secrets:
  jwt_public:
    file: ${BANK_API_SECRETS_DIR:-./secrets}/jwt-public.pem
  jwt_private:
    file: ${BANK_API_SECRETS_DIR:-./secrets}/jwt-private.pem

networks:
  edge:
  backend:
    internal: true
  events:
    internal: true
  identity-data:
    internal: true
  banking-data:
    internal: true
  notification-data:
    internal: true

volumes:
  bank_api_identity_data:
  bank_api_banking_data:
  bank_api_kafka_data:
  bank_api_notification_v2_data:
