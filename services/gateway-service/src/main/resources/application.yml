spring:
  application:
    name: gateway-service
  http:
    client:
      connect-timeout: 1s
      read-timeout: 5s
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity
              uri: ${IDENTITY_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/admin/users/**,/openapi/identity
              filters:
                - RemoveRequestHeader=X-Internal-Token
            - id: banking
              uri: ${BANKING_URL:http://localhost:8082}
              predicates:
                - Path=/api/accounts/**,/api/cards/**,/api/reports/**,/api/admin/accounts/**,/api/admin/cards/**,/api/admin/transactions/**,/openapi/banking
              filters:
                - RemoveRequestHeader=X-Internal-Token

springdoc:
  api-docs:
    path: /openapi/gateway
  swagger-ui:
    urls:
      - name: Identity
        url: /openapi/identity
      - name: Banking
        url: /openapi/banking

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: logstash
