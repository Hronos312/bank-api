spring:
  jackson:
    use-jackson2-defaults: true
  application:
    name: notification-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: notification-service-dev
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 3000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 15000

    listener:
      ack-mode: record
      observation-enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notifications_db}
    username: ${DB_USERNAME:notification_user}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  kafka:
    topic: bank.transactions.v1

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,kafkaBroker
logging:
  structured:
    format:
      console: logstash
